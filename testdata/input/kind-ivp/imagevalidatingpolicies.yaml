      mutateDigest: true
      required: true
      verifyDigest: true
    validations:
    - expression: variables.sigfail.size() == 0
      messageExpression: '''no valid signature from the spike signing workflow for:
        '' + variables.sigfail.join('', '')'
    - expression: variables.sbomfail.size() == 0
      messageExpression: '''missing or invalid CycloneDX SBOM attestation for: ''
        + variables.sbomfail.join('', '')'
    - expression: variables.vulnunverified.size() == 0
      messageExpression: '''missing or unverified vulnerability attestation for: ''
        + variables.vulnunverified.join('', '')'
    - expression: variables.vulnstale.size() == 0
      messageExpression: '''stale vulnerability attestation for: '' + variables.vulnstale.join('',
        '')'
    variables:
    - expression: images.containers.filter(i, verifyImageSignatures(i, [attestors.forgeci])
        == 0)
      name: sigfail
    - expression: |-
        images.containers.filter(i,
          !(verifyAttestationSignatures(i, attestations.sbom, [attestors.forgeci]) > 0 &&
            extractPayload(i, attestations.sbom).predicate.bomFormat == 'CycloneDX'))
      name: sbomfail
    - expression: |-
        images.containers.filter(i,
          verifyAttestationSignatures(i, attestations.vuln, [attestors.forgeci]) == 0)
      name: vulnunverified
    - expression: |-
        images.containers.filter(i,
          !(i in variables.vulnunverified) &&
          !(timestamp(extractPayload(i, attestations.vuln).predicate.metadata.scanFinishedOn) > time.now() - duration('720h')))
      name: vulnstale
    webhookConfiguration:
      timeoutSeconds: 30
